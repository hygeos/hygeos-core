[project]
name = "core"
version = "1.2.4"
description = "Common Operations for Robust Engineering"
authors = [
    {name = "François Steinmetz", email = "fs@hygeos.com"},
    {name = "Joackim Orcière", email = "joackim.orciere@hygeos.com"},
    {name = "Nathan Capon", email = "nathan.capon@hygeos.com"}
]
requires-python = ">=3.10"
dependencies = ["tqdm", "xarray", "dask", "h5netcdf", "python-dotenv", "toml", "lxml", "scipy"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.environments]
default = { features = ["sys", "test"], solve-group = "default" }

[tool.pixi.tasks]
tests = "pytest tests"
build_docs = "sphinx-build -b html docs/source docs/build"
docs-build = "quartodoc build --config docs/_quarto.yml"
docs-render = { cmd = "quarto render docs/", depends-on = ["docs-build"] }
docs-preview = { cmd = "quarto preview docs/", depends-on = ["docs-build"] }

[tool.pixi.dependencies]
tqdm = "*"
xarray = "*"
dask = "*"
scipy = "*" # used for core.interpolate tests
h5netcdf = "*"
python-dotenv = "*"
toml = "*"
matplotlib-base = "*"
lxml = "*"
sphinx = "*"
ipykernel = "*"
zarr = "*"
quartodoc = "*"
nbformat = "*"
nbclient = "*"
jupyter-cache = "*"
griffe = ">=1.0,<2.0"

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-html = "*"
pytest-xdist = "*"
pooch = "*"
numba = "*"

[tool.pixi.feature.sys.dependencies]
sphinx_rtd_theme = "*"
sphinx = "*"
