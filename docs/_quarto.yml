project:
  type: website
  preview:
    port: 8000
    browser: false

# tell quarto to read the generated sidebar and styles
metadata-files:
  - reference/_sidebar.yml

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css:
      - _extensions/hygeos-docs/css/hygeos-docs.css
    toc: true

execute:
  echo: false
  cache: true
  warning: false


website:
  title: "core"
  site-url: "https://hygeos.github.io/Core/"
  repo-url: "https://github.com/hygeos/Core"
  repo-actions: [issue]
  page-navigation: true
  open-graph: true
  search:
    location: navbar
    type: overlay
  navbar:
    background: primary
    search: true
    logo: _extensions/hygeos-docs/logo-carre-blanc.png
    logo-alt: "HYGEOS"
    left:
      - text: "Home"
        file: index.qmd
      - text: "Reference"
        href: reference/
      - text: "Guides"
        menu:
          - text: "Getting Started"
            file: articles/getting-started.qmd
    right:
      - icon: github
        href: "https://github.com/hygeos/Core"
        aria-label: "GitHub Repository"
  page-footer:
    center: |
      Powered by [HYGEOS](https://www.hygeos.com) | core &copy; 2026 | version 1.2.4
  sidebar:
    - title: "Overview"
      contents:
        - index.qmd
    - title: "Guides"
      contents:
        - articles/getting-started.qmd


quartodoc:
  package: core
  dir: reference
  title: API Reference

  # write sidebar and style data
  sidebar: reference/_sidebar.yml
  css: reference/_styles-quartodoc.css
  
  
  sections:
    - title: Files
      desc: File utilities, caching, and I/O helpers
      contents:
        - files.fileutils
        - files.save
        - files.cache
        - files.uncompress
        - files.lock
    - title: Static
      desc: Decorators for class design patterns (abstract, singleton, interface, virtual)
      contents:
        - static.abstract
        - static.singleton
        - static.interface
        - static.virtual
        - static.parametrized
    - title: Process
      desc: Block processing framework for xarray datasets
      contents:
        - process.blockwise
        - process.condor
        - process.deptree
    - title: Geo
      desc: Product naming, patterns, and coordinate conversion utilities
      contents:
        - geo.product_name
        - geo.naming
        - geo.convert
    - title: Network
      desc: Download, FTP, and authentication utilities
      contents:
        - network.download
        - network.ftp
        - network.auth
    - title: Tests
      desc: Test utilities and fixtures
      contents:
        - tests.pytest_utils
        - tests.conftest
        - tests.graphics
    - title: Tools
      desc: General utility functions for xarray, dates, environment, and more
      contents:
        - tools
        - dates
        - env
        - fuzzy
        - xrtags
        - import_utils
        - monitor
        - progressbar
        - ascii_table
        - interpolate
        - masks
        - table
        - config
        - log
